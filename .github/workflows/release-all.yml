name: Build all platforms and publish release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "vendor/**"
      - "icons/**"
      - "licenses/**"
      - "desktop/**"
      - "android-app/**"
      - "build/**"
      - "site/**"
      - "tests/**"
      - ".github/workflows/release-all.yml"

permissions:
  contents: write

concurrency:
  group: release-v1.24.0
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate application
        run: npm run check && npm test
      - name: Package Web/PWA
        run: |
          cd site
          zip -qr ../PC-Lab-Builder-3D-1.24.0-Web-PWA.zip .
          cd ..
          printf '%s\n' \
            'PC Lab Builder 3D v1.24.0 - iPhone/iPad' \
            '' \
            '1. Abre en Safari: https://juanmerchan-del-milo.github.io/AMD-and-Intel/' \
            '2. Toca Compartir.' \
            '3. Selecciona Añadir a pantalla de inicio.' \
            '' \
            'Una IPA nativa requiere firma Apple Developer. La PWA es la versión instalable sin esa cuenta.' \
            > iPhone-iPad-INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-pwa
          path: |
            PC-Lab-Builder-3D-1.24.0-Web-PWA.zip
            iPhone-iPad-INSTALL.txt

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        working-directory: android-app
        run: gradle clean assembleRelease
      - name: Verify and name APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk PC-Lab-Builder-3D-1.24.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PC-Lab-Builder-3D-1.24.0-Android.apk

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript and compatibility engine
        run: npm run check && npm test
      - name: Build desktop package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: find dist -maxdepth 2 -type f -print
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.24.0 --yes --cleanup-tag || true
          gh release create v1.24.0 dist/* \
            --title "PC Lab Builder 3D v1.24.0" \
            --target "$GITHUB_SHA" \
            --notes "Constructor 3D unificado y catálogo ampliado de CPU, GPU, DDR1-DDR5, almacenamiento SATA/PCIe 1.0-5.0, placas, fuentes, refrigeración y gabinetes. Repara Generaciones, NPU, portátiles y mini PC; separa plataformas y marcas en el laboratorio; mejora el zoom táctil y el rendimiento 3D. Incluye Android, Windows Installer/Portable, Linux, macOS Intel/Apple Silicon y Web/PWA para iPhone/iPad. La compatibilidad y potencia son orientativas: confirma BIOS, QVL, conectores y dimensiones antes de comprar."
