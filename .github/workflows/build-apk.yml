name: Build AMD vs Intel v1.1.8

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android APK
        working-directory: android-app
        run: gradle clean assembleDebug
      - name: Prepare files
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk AMD-vs-Intel-v1.1.8.apk
          zip -qr AMD-vs-Intel-Android-Project-v1.1.8.zip android-app -x "*/build/*" "*/.gradle/*"
          cp index.html AMD-vs-Intel-App-v1.1.8.html
      - uses: actions/upload-artifact@v4
        with:
          name: AMD-vs-Intel-v1.1.8-APK
          path: AMD-vs-Intel-v1.1.8.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AMD-vs-Intel-Android-Project-v1.1.8
          path: AMD-vs-Intel-Android-Project-v1.1.8.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AMD-vs-Intel-App-v1.1.8
          path: AMD-vs-Intel-App-v1.1.8.html
