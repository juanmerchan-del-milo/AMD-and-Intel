name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        working-directory: android-app
        run: gradle clean assembleRelease
      - name: Verify and name APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/release/app-release.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk PC-Lab-Builder-3D-1.24.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Lab-Builder-3D-1.24.0-Android
          path: PC-Lab-Builder-3D-1.24.0-Android.apk
