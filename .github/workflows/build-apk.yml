name: Build AMD vs Intel

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Android APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AMD-vs-Intel-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare Windows package
        shell: bash
        run: |
          mkdir -p windows-package
          cp index.html windows-package/AMD_vs_Intel.html
          printf '@echo off\r\nstart "" "AMD_vs_Intel.html"\r\n' > windows-package/Abrir_AMD_vs_Intel.bat
          printf 'AMD vs Intel - Windows\r\n\r\n1. Extrae esta carpeta.\r\n2. Haz doble clic en Abrir_AMD_vs_Intel.bat.\r\n3. Se abrira la aplicacion en tu navegador en Windows.\r\n' > windows-package/LEEME.txt
          cp "ChatGPT Image 17 sept 2026, 20_25_33.png" windows-package/icono_AMD_vs_Intel.png || true

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: AMD-vs-Intel-Windows
          path: windows-package/
