name: Build AMD vs Intel APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build clean Android APK
        working-directory: android-app
        run: gradle clean assembleDebug

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk AMD-vs-Intel-v1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMD-vs-Intel-v1.1.0-APK
          path: AMD-vs-Intel-v1.1.0.apk
