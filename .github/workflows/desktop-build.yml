name: Build Windows, Linux and macOS desktop apps

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: PC-Lab-Builder-3D-1.25.0-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
            release/*.zip
          if-no-files-found: error
