name: Build AMD vs Intel Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify website
        run: |
          test -f site/index.html
          test -f site/manifest.webmanifest
          test -f site/sw.js
          grep -q "<title>AMD vs Intel</title>" site/index.html

      - name: Create website ZIP
        run: |
          cd site
          zip -qr ../AMD-Intel-CPU-Lab-Web-1.21.3.zip .

      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: AMD-Intel-CPU-Lab-Web-1.21.3
          path: AMD-Intel-CPU-Lab-Web-1.21.3.zip
