<section id="cpuFamilyWelcome" class="cpu-welcome" aria-labelledby="cpuWelcomeTitle">
  <div class="cpu-welcome-shell">
    <div class="cpu-welcome-top">
      <span class="cpu-welcome-kicker" data-welcome="kicker">Guía rápida de procesadores</span>
      <h1 id="cpuWelcomeTitle" data-welcome="title">Conoce las familias antes de entrar</h1>
      <p class="cpu-welcome-sub" data-welcome="sub"></p>
    </div>
    <div class="cpu-family-grid">
      <article class="cpu-family intel">
        <div class="cpu-family-head">
          <div class="cpu-family-name"><span class="cpu-family-logo">I</span><span>Intel Core</span></div>
          <span class="cpu-family-note" data-welcome="intelNote"></span>
        </div>
        <div class="cpu-tiers">
          <div class="cpu-tier"><strong>Core i3</strong><p data-welcome="intel3"></p><div class="cpu-tier-meter"><span style="width:35%"></span></div></div>
          <div class="cpu-tier"><strong>Core i5</strong><p data-welcome="intel5"></p><div class="cpu-tier-meter"><span style="width:55%"></span></div></div>
          <div class="cpu-tier"><strong>Core i7</strong><p data-welcome="intel7"></p><div class="cpu-tier-meter"><span style="width:78%"></span></div></div>
          <div class="cpu-tier"><strong>Core i9</strong><p data-welcome="intel9"></p><div class="cpu-tier-meter"><span style="width:100%"></span></div></div>
        </div>
      </article>
      <article class="cpu-family amd">
        <div class="cpu-family-head">
          <div class="cpu-family-name"><span class="cpu-family-logo">A</span><span>AMD Ryzen</span></div>
          <span class="cpu-family-note" data-welcome="amdNote"></span>
        </div>
        <div class="cpu-tiers">
          <div class="cpu-tier"><strong>Ryzen 3</strong><p data-welcome="amd3"></p><div class="cpu-tier-meter"><span style="width:35%"></span></div></div>
          <div class="cpu-tier"><strong>Ryzen 5</strong><p data-welcome="amd5"></p><div class="cpu-tier-meter"><span style="width:55%"></span></div></div>
          <div class="cpu-tier"><strong>Ryzen 7</strong><p data-welcome="amd7"></p><div class="cpu-tier-meter"><span style="width:78%"></span></div></div>
          <div class="cpu-tier"><strong>Ryzen 9</strong><p data-welcome="amd9"></p><div class="cpu-tier-meter"><span style="width:100%"></span></div></div>
        </div>
      </article>
    </div>
    <p class="cpu-welcome-tip" data-welcome="tip"></p>
    <div class="cpu-welcome-more"><span data-welcome="more"></span><span aria-hidden="true">↓</span></div>
    <div class="cpu-welcome-actions"><button id="cpuFamilyContinue" class="cpu-welcome-continue" type="button" data-welcome="continue">Continuar</button></div>
  </div>
</section>

<main>
 <section class="intro"><div><span class="eyebrow" data-t="introKicker"></span><h1 data-t="title"></h1><p data-t="subtitle"></p></div><div class="intro-actions"><button class="btn" id="importBuild" data-t="import"></button><button class="btn primary" id="saveBuild" data-t="save"></button></div></section>
 <section id="builderView" class="view">
  <div class="assembly-mode"><label for="assemblyMode" data-t="assemblyMode"></label><select id="assemblyMode"><option value="desktop" data-t="desktopMode"></option><option value="study" data-t="studyMode"></option></select><p id="studyNotice" data-t="studyNotice" hidden></p></div>
  <div class="preset-strip"><span data-t="preset"></span><button data-preset="balanced" data-t="balanced"></button><button data-preset="retro" data-t="retro"></button><button data-preset="extreme" data-t="extreme"></button><button data-preset="itx" data-t="itx"></button></div>
  <div class="build-grid">
   <aside class="parts-panel panel"><div class="panel-heading"><h2 data-t="components"></h2><span id="partProgress" class="mono"></span></div><div id="buildParts"></div><button class="text-action" id="shareBuild" data-t="export"></button></aside>
   <section class="viewport-panel panel"><div class="viewport-heading"><span><i class="live-dot"></i> <b data-t="preview"></b></span><span class="mono" data-t="realtime"></span></div><div id="viewport" aria-label="PC 3D"><div id="webglFallback" hidden data-t="noWebgl"></div><span class="scene-badge" id="sceneBadge"></span></div><div class="scene-controls"><button id="inspectSelected" data-t="inspectSelected"></button><button id="resetCamera" data-t="reset"></button><button id="autoRotate" data-t="rotate" aria-pressed="false"></button><button id="toggleGlass" data-t="glass" aria-pressed="false"></button><button id="lowQuality" data-t="quality" aria-pressed="false"></button></div><div class="explode-control"><label for="explodeRange" data-t="explode"></label><input type="range" id="explodeRange" min="0" max="100" value="0"><output id="explodeValue">0%</output></div><p class="scene-hint" data-t="gesture"></p><p class="fine scene-note" data-t="schematic"></p></section>
   <aside class="health-panel"><section class="power-panel panel"><span class="eyebrow" data-t="budget"></span><div class="watt-display"><b id="powerTotal">0</b><span>W</span></div><div class="power-track" id="powerTrack"></div><div class="power-key"><span><i class="key-cpu"></i> CPU</span><span><i class="key-gpu"></i> GPU</span><span><i class="key-other"></i> +</span></div><div class="psu-recommend"><span data-t="psuRecommend"></span><strong id="recommendedPsu"></strong></div><p class="fine" data-t="notMeasured"></p><details><summary data-t="power"></summary><p class="fine" data-t="powerExplain"></p></details></section><section class="compat-panel panel"><h2 data-t="compatibility"></h2><div id="compatStatus"></div><div id="compatIssues" aria-live="polite"></div><details><summary><span data-t="warningTitle"></span> <b id="warningCount"></b></summary><ul id="compatWarnings"></ul></details></section></aside>
  </div>
 </section>
 <section id="selectionArea" class="panel"><div class="catalog-heading"><div><span class="eyebrow" id="catalogKicker"></span><h2 id="catalogTitle"></h2></div><button id="addCustom" class="btn" data-t="addCustom"></button></div><div id="categoryTabs" class="category-tabs"></div><div class="filters"><input type="search" id="search" data-placeholder="search" aria-label="Search"><select id="brandFilter" aria-label="Brand"></select><select id="platformFilter" aria-label="Platform" hidden></select><select id="sort" aria-label="Sort"><option value="name" data-t="modelOrder"></option><option value="watts" data-t="powerOrder"></option><option value="capacity" data-t="capacityOrder"></option></select><label class="filter-check"><input type="checkbox" id="fitFilter"><span data-t="fitFilter"></span></label></div><div id="filterNotice" class="filter-notice" hidden><p data-t="filterNotice"></p><button id="showEveryModel" data-t="showEveryModel"></button></div><div class="catalog-stats"><span id="resultCount"></span><span data-t="wattsNotSpeed"></span></div><div id="products" class="product-grid"></div><p class="fine" data-t="catalogNote"></p></section>
 <section id="workshopView" class="view workshop-view" hidden aria-labelledby="workshopTitle">
  <div class="workshop-heading"><div><span class="eyebrow" data-w="kicker"></span><h2 id="workshopTitle" data-w="title"></h2><p data-w="subtitle"></p></div><button id="workshopBack" data-w="back"></button></div>
  <div class="workshop-layout">
   <section class="workshop-stage panel">
    <div class="workshop-modes" role="group" aria-label="Modo / Mode"><button id="workshopAnatomy" data-w="anatomy" aria-pressed="true"></button><button id="workshopOperation" data-w="operation" aria-pressed="false"></button><button id="workshopExpand" data-w="expand" aria-pressed="false"></button></div><div class="workshop-model-heading"><small data-w="family"></small><h3 id="workshopName"></h3><p id="workshopSpecs"></p></div>
    <div id="workshopViewport" role="img" aria-label="Taller 3D"><div id="workshopLabels" class="workshop-labels"></div><div id="workshopFallback" data-w="fallback" hidden></div></div>
    <div class="workshop-toolbar"><button id="workshopZoomIn" data-w="zoomIn"></button><button id="workshopZoomOut" data-w="zoomOut"></button><button id="workshopReset" data-w="reset"></button><button id="workshopTop" data-w="front"></button><button id="workshopBottom" data-w="rear"></button><button id="workshopRotate" data-w="rotate" aria-pressed="false"></button><button id="workshopLabelsToggle" data-w="labels" aria-pressed="false"></button><button id="workshopXray" data-w="xray" aria-pressed="false"></button><button id="workshopHD" data-w="hd" aria-pressed="true"></button><button id="workshopLow" data-w="low" aria-pressed="false"></button></div>
    <p class="scene-hint" data-w="gesture"></p>
    <section id="workshopFunction" class="workshop-function" hidden aria-label="Cómo funciona / How it works"><div class="function-heading"><h3 data-w="operation"></h3><select id="workshopChannel" aria-label="Recorrido / Path"></select></div><div id="workshopLessonSteps" class="lesson-steps"></div><h4 id="workshopLessonTitle"></h4><p id="workshopLessonBody"></p><div class="function-controls"><button id="workshopLessonPrev" data-w="prevLesson"></button><button id="workshopPlay" data-w="play" aria-pressed="false"></button><button id="workshopLessonNext" data-w="nextLesson"></button><label><span data-w="rate"></span><select id="workshopRate"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><p id="workshopIsolatedFlow" data-w="isolatedFlow" hidden></p><p class="fine" data-w="flowNote"></p></section><div class="workshop-stepper"><div class="range-row"><label for="workshopRange" data-w="layers"></label><input type="range" id="workshopRange" min="0" max="4" step="0.01" value="0"><output id="workshopOutput" for="workshopRange">0 / 4</output></div><label class="conceptual-toggle"><input id="workshopConceptual" type="checkbox"><span data-w="conceptual"></span></label><p id="workshopConceptualNote" class="fine" data-w="conceptualNote" hidden></p><div class="range-row spacing-row"><label for="workshopSpacing" data-w="spacing"></label><input id="workshopSpacing" type="range" min="0.7" max="2" step="0.05" value="1"><output id="workshopSpacingValue">1×</output></div><p id="workshopStatus" class="step-status" role="status" aria-live="polite"></p><div class="workshop-step-buttons"><button id="workshopPrev" data-w="previous"></button><button id="workshopNext" data-w="next"></button><button id="workshopAssemble" data-w="assemble"></button><button id="workshopDisassemble" data-w="disassemble" class="primary"></button></div></div>
    <div class="workshop-notes"><p data-w="note"></p><p id="workshopKitNote" data-w="kit" hidden></p><p class="safety" data-w="safety"></p><div class="workshop-references"><a id="workshopReference" target="_blank" rel="noopener noreferrer" data-w="reference"></a><a id="workshopSource" target="_blank" rel="noopener noreferrer" data-w="source"></a></div></div>
   </section>
   <aside class="workshop-sidebar panel">
    <div class="workshop-selects"><label><span data-w="category"></span><select id="workshopCategory"><option value="cpu" data-w="cpu"></option><option value="gpu" data-w="gpu"></option><option value="ram" data-w="ram"></option><option value="storage" data-w="storage"></option><option value="motherboard" data-w="motherboard"></option><option value="psu" data-w="psu"></option><option value="cooler" data-w="cooler"></option><option value="case" data-w="case"></option></select></label><label><span data-w="model"></span><select id="workshopModel"></select></label><label id="workshopCoverLabel" class="cover-toggle" hidden><input type="checkbox" id="workshopCover" checked><span data-w="coverOption"></span></label></div>
    <h3 data-w="parts"></h3><div id="workshopParts"></div>
    <div class="workshop-description" aria-live="polite"><h4 id="workshopPartName"></h4><p id="workshopPartText"></p><button id="workshopIsolate" data-w="focus" aria-pressed="false"></button></div>
    <button id="workshopUse" class="primary workshop-use" data-w="use"></button>
   </aside>
  </div>
 </section>
 <section id="learnView" class="view panel" hidden><div class="section-title"><span class="eyebrow" data-t="learnKicker"></span><h2 data-t="learn"></h2></div><div id="glossary" class="glossary"></div><h3 data-t="source"></h3><div id="sources" class="source-links"></div></section>
