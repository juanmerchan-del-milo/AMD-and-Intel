plugins { id 'com.android.application' }

android {
    namespace 'com.juanpablo.amdvsintel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.juanpablo.amdvsintel'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}
